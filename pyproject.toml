[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "code-spider"
version = "0.1.1"
description = "Centralized codebase knowledge graph + coordinate index for AI coding agents (Neo4j-backed)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Code Spider Authors" }]
keywords = ["knowledge-graph", "code-intelligence", "neo4j", "tree-sitter", "mcp", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "License :: OSI Approved :: Apache Software License",
]

dependencies = [
    "neo4j>=5.20",
    "tree-sitter>=0.24,<0.26",
    "tree-sitter-python>=0.23,<0.26",
    "tree-sitter-typescript>=0.23,<0.26",
    "tree-sitter-javascript>=0.23,<0.26",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "blake3>=0.4",
    "GitPython>=3.1.43",
    "structlog>=24.1",
    "tenacity>=8.3",
    "prometheus-client>=0.20",
    "mcp>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
embedding = [
    "sentence-transformers>=3.0",
    "torch>=2.3",
]
# LiteLLM-backed external embeddings (Voyage, OpenAI, Cohere, OpenRouter, ...).
# Kept optional so installs that only use the local sentence-transformers
# provider stay slim. ``litellm`` itself pulls a moderate dep tree.
litellm = [
    "litellm>=1.40",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]
all = [
    "code-spider[embedding,litellm,dev]",
]

[project.scripts]
code-spider = "code_spider.cli:app"

[project.urls]
Homepage = "https://github.com/hypen-code/code-spider"
Issues = "https://github.com/hypen-code/code-spider/issues"

[tool.hatch.build.targets.wheel]
packages = ["code_spider"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "PL",  # pylint
    "RUF", # ruff-specific
]
ignore = [
    "PLR0913",  # too many args
    "PLR0911",  # too many returns
    "PLR2004",  # magic value
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "S101", "PLC0415"]
# Typer uses callable defaults (`typer.Option(...)`) by design; lazy mcp/serve
# import keeps the heavy SDK out of the migrate/index hot path.
"code_spider/cli.py" = ["B008", "PLC0415"]
# Lazy adapter loading uses function-local imports on purpose.
"code_spider/parser/base.py" = ["PLC0415"]
# Optional-dep guard + lazy registry pattern.
"code_spider/embedding/provider.py" = ["PLC0415"]
"code_spider/embedding/st_provider.py" = ["PLC0415"]
"code_spider/embedding/litellm_provider.py" = ["PLC0415"]
# `index_workspace` orchestrates many stages; splitting it would hurt readability.
"code_spider/indexer.py" = ["PLR0915"]
# Module-level singleton for the MCP server context is intentional.
"code_spider/mcp/context.py" = ["PLW0603"]
# Process-wide count-cache singleton lets the writer invalidate without
# threading a handle through every call site.
"code_spider/graph/count_cache.py" = ["PLW0603"]
# Onboarding deliberately uses function-local imports so that `--help`, the
# `configure` wizard, and `mcp-config` (no Neo4j needed) stay cheap and never
# pull in the graph driver / mcp SDK on cold start.
"code_spider/onboarding.py" = ["PLC0415"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tree_sitter.*", "tree_sitter_python", "tree_sitter_typescript", "tree_sitter_javascript", "blake3", "git.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Integration tests need a live Neo4j; opt in with `pytest -m integration`.
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not integration"]
markers = [
    "integration: requires a live Neo4j instance",
    "slow: takes > 1s",
]
