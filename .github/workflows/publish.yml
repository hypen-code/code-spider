name: publish

# Publish to PyPI when a version tag (v0.1.0, v1.2.3, ...) is pushed.
#
# Uses PyPI Trusted Publishing (OIDC) — no PYPI_TOKEN secret required.
# Configure once: https://pypi.org/manage/account/publishing/
#   project name: code-spider
#   workflow filename: publish.yml
#   environment: pypi   (must match `environment:` below)

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Verify tag matches pyproject version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PYV=$(python -c "import tomllib,sys; print(tomllib.loads(open('pyproject.toml','rb').read().decode())['project']['version'])")
          if [ "$TAG" != "$PYV" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (=$TAG) does not match pyproject version $PYV"
            exit 1
          fi

      - name: Build
        run: python -m build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/code-spider
    permissions:
      id-token: write  # required for OIDC / trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
