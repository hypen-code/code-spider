services:
  neo4j:
    image: neo4j:5.24-community
    container_name: code-spider-neo4j
    ports:
      - "7474:7474"  # HTTP / Browser
      - "7687:7687"  # Bolt
    environment:
      NEO4J_AUTH: neo4j/codespider-dev-password
      # Memory tuning for dev workstations
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
      # Required for vector + fulltext indexes on Community 5.x
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - ./neo4j_data:/data
      - ./neo4j_logs:/logs
      - ./neo4j_plugins:/plugins
      - ./neo4j_import:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
